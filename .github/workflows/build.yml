name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    # contents: write so the APK can be attached to the "latest" release as a
    # direct .apk download. Workflow artifacts are always zipped; a release
    # asset is a plain file the phone can install straight from the browser.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - name: Build debug APK
        run: ./gradlew :demo:assembleDebug --stacktrace

      - name: Publish installable APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp demo/build/outputs/apk/debug/demo-debug.apk compose-uikit-demo.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Latest demo build" \
            --notes "Installable debug APK. Replaced on every push to main." \
            --prerelease
          gh release upload latest compose-uikit-demo.apk --clobber
          echo "Direct download: https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/compose-uikit-demo.apk"

  docs:
    name: Regenerate site
    runs-on: ubuntu-latest
    # Regenerate docs/ and commit, so preview media dropped in from a phone
    # shows up on the site without anyone running the generator locally.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate docs
        run: python3 tools/generate_docs.py

      - name: Commit if the generated output changed
        run: |
          if git diff --quiet -- docs; then
            echo "docs/ already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Regenerate component docs"
          git push